[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "residualrl-cello-robot"
version = "0.1.0"
description = "Residual reinforcement learning for expressive robotic cello bowing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium>=1.0,<2",
    "librosa>=0.11,<1",
    "matplotlib>=3.9,<4",
    "mido>=1.3,<2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "sounddevice>=0.5,<1",
    "soundfile>=0.13,<1",
    "stable-baselines3>=2.8,<3",
    "torch>=2.8,<3",
]

[project.optional-dependencies]
hardware = [
    "ur-rtde>=1.6,<2",
]
labeling = [
    "label-studio>=1.20,<2",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools]
py-modules = ["constants"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
